name: .NET Clean Architecture CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Cho phép bấm chạy bằng tay

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    # Bước 1: Tải code từ kho chứa GitHub về cái máy ảo (runner)
    - name: 📥 Tải source code về máy ảo (Checkout)
      uses: actions/checkout@v4

    # Bước 2: Báo cho runner biết mình muốn dùng môi trường .NET
    - name: ⚙️ Cài đặt .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # (Thay đổi nếu cậu dùng .NET 7 hoặc 9)

    # Bước 3: Tải các dependencies/Nuget packages
    - name: 📦 Khôi phục thư viện (Restore)
      run: dotnet restore CleanArchitectureDemo/CleanApi.sln

    # Bước 4: Build ứng dụng
    - name: 🔨 Build toàn bộ Solution
      run: dotnet build CleanArchitectureDemo/CleanApi.sln --no-restore --configuration Release

    # Bước 5: Chạy Test (hiện tại chưa có project test nhưng cứ để chuẩn CI)
    - name: 🧪 Chạy Unit Tests
      run: dotnet test CleanArchitectureDemo/CleanApi.sln --no-build --verbosity normal --configuration Release

    # Bước 6: Đóng gói project WebApi ra một thư mục để sẵn sàng đem đi deploy
    - name: 📤 Đóng gói WebApi (Publish)
      run: dotnet publish CleanArchitectureDemo/CleanApi.WebApi/CleanApi.WebApi.csproj -c Release -o ./publish_output

    # Bước 7: Upload file đã đóng gói lên GitHub để job sau (Deploy) có thể lấy xuống
    - name: 💼 Lưu trữ bản Build (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: webapi-production-build
        path: ./publish_output/

    # Bước 8: Báo cáo kết quả CI/CD về Discord
    - name: 📢 Báo cáo trạng thái CI/CD về Discord
      uses: sarisia/actions-status-discord@v1
      if: always() # Kim bài miễn tử: Các bước trên có lỗi thì bước này vẫn phải chạy để báo cáo
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
        status: ${{ job.status }}
        title: "Trạng thái CI/CD: ${{ github.repository }}"
        description: |
          **Người chạy:** `${{ github.actor }}`
          **Nhánh:** `${{ github.ref_name }}`
          **Nội dung Commit:** `${{ github.event.head_commit.message }}`
          👉 Bấm vào tiêu đề màu xanh bên trên để xem log chi tiết.
